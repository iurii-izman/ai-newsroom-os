[project]
name = "ai-newsroom"
version = "0.1.0"
description = "Proof-first F1/F2 vertical MVP for AI Newsroom OS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=2,<3",
    "pydantic>=2.12,<3",
    "typer>=0.20,<1",
]

[project.scripts]
ai-newsroom = "ai_newsroom.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
